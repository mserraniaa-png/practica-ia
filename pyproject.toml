[project]
name = "practica-ia"
version = "0.1.0"
description = "Práctica 1: ¿esta reseña de restaurante hay que atenderla?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "matplotlib>=3.11.2",
    "gradio>=6.32.0",
]

[tool.uv]
# En local se instala todo; el contenedor usa --no-default-groups.
default-groups = ["dev", "datos"]

[tool.uv.sources]
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }
# Linux (imagen Docker): torch sólo CPU, sin CUDA (ADR-08). En macOS el de PyPI ya es CPU.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# Sólo para anonimizar.py (no va en la app ni en el contenedor).
datos = [
    "spacy>=3.8",
    "es-core-news-sm",
]
dev = [
    "pytest>=9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resenas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
