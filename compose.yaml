# Respaldo local (D33): docker compose up --build  →  http://localhost:7860
services:
  app:
    build: .
    image: resenas-atender
    ports:
      - "7860:7860"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 40s
      retries: 3
