[project]
name = "practica-ia"
version = "0.1.0"
description = "Práctica 1: ¿esta reseña de restaurante hay que atenderla?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2",
    "spacy>=3.8",
    "es-core-news-sm",
]

[tool.uv.sources]
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resenas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
